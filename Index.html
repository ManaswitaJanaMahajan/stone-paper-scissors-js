<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone-Paper-Scisssor</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <h1><i>Stone Paper Scissors</i></h1>
    <div class="Choices">
      <div class="Choice" id="Rock">
        <img src="rock.jpg" />
      </div>
      <div class="Choice" id="Paper">
        <img src="paper.jpg" />
      </div>
      <div class="Choice" id="Scissor">
        <img src="scissors.jpg" />
      </div>
    </div>
    <div class="ScoreBoard">
      <div class="Score">
        <p id="user-score" style="font-size: 4rem;">0</p>
        <p>User(You)</p>
      </div>
      <div class="Score">
        <p id="com-score" style="font-size: 4rem;">0</p>
        <p>Computer</p>
      </div>
    </div>
    <div class="MsgCon">
        <p id="msg">Play Your Move</p>
    </div>
    <br>
    <div>
        <button id="rst-btn">Reset Game</button>
    </div>

    
    <script src="SPS.js"></script>
</body>
</html>
